<!DOCTYPE html>
<html lange="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gelir & Gider Takip</title>
        <link rel="stylesheet" href="../static/css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
    <div class="container">
    
        <header>
            <h1> Bütçe Takip</h1>
            <p>Gelir ve giderlerini kolayca yönet</p>
        </header>
        
        <div class="summary-cards">
            <div class="card balance-card">
                <h3>Toplam Bakiye</h3>
                <h2 id="total-balance">₺0.00</h2>
            </div>
            <div class="card income-card">
                <h3>Toplam Gelir</h3>
                <h2 id="total-income">+₺0.00</h2>
            </div>
            <div class="card expense-card">
                <h3>Toplam Gider</h3>
                <h2 id="total-expense">-₺0.00</h2>
            </div>
        </div>
       
        <div class="form-container">
            <h3>Yeni İşlem Ekle</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="desc">Açıklama</label>
                    <input type="text" id="desc" placeholder="Örn: Market alışverişi, Maaş..." required>
                </div>
                <div class="form-group">
                    <label for="amount">Tutar (₺)</label>
                    <input type="number" id="amount" placeholder="Örn: 250" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="type">İşlem Türü</label>
                    <select id="type">
                        <option value="expense">Gider (-)</option>
                        <option value="income">Gelir (+)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Ekle</button>
            </form>
        </div>

        <div class="history-container">
            <h3>İşlem Geçmişi</h3>
            <ul id="transaction-list" class="transaction-list">               
            </ul>
        </div>
    </div>
    <script src="../static/js/main.js"></script>
</body>
</html>
